# GitHub Pages 自动部署工作流
# 触发：push 到 main 分支（或手动触发）
# 流程：Node 20 → npm ci → npm run build → 上传 dist → 发布 Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# Pages 部署所需权限：pages 写权限 + id-token（OIDC 认证）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支并发部署时取消旧任务，避免部署冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 构建任务：产出静态站点产物
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 发布任务：将上传的产物部署到 GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
