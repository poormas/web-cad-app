# web-cad-app 生产站点配置（挂载为 /etc/nginx/conf.d/default.conf）
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 放宽请求体上限，便于导入大型 DXF 图纸
    client_max_body_size 100m;

    # ---------- Gzip 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # ---------- Vite 带 hash 的静态资源：长期不可变强缓存 ----------
    # 文件名含内容 hash（index-XXXX.js/css），内容变更即换名，可安全缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- 入口 HTML：禁用缓存，保证发版即时生效 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ---------- SPA 路由回退 ----------
    # 未命中真实文件的路径一律回退到 index.html（经上面的 =/index.html 规则应用 no-cache）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
